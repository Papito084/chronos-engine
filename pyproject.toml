[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-engine"
version = "0.1.0"
description = "Deterministic Ultra-Low Latency Order Matching Engine with Event Sourcing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Principal HFT Systems Architect" }]
dependencies = [
    "sortedcontainers>=2.4.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
gateway = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "orjson>=3.9.0",
    "psutil>=5.9.0",
    "clickhouse-connect>=0.7.0",
    "aiokafka>=0.10.0",
]
simulator = [
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "persistence/tests", "gateway/tests", "simulator/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
